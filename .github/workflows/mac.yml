name: mac

on:
  push:
    branches: [tiktok-usb-helper, main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            arch: apple
            artifact: mac-helper-apple
            asset: TikTok-USB-Helper-macOS-Apple
          - os: macos-13
            arch: intel
            artifact: mac-helper-intel
            asset: TikTok-USB-Helper-macOS-Intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Tk and install PyInstaller
        run: |
          uname -m
          python -c "import tkinter; print('tk', tkinter.TkVersion)"
          python -m pip install --upgrade pip pyinstaller

      - name: Download macOS adb
        run: |
          curl -fL --retry 3 -o /tmp/pt.zip https://dl.google.com/android/repository/platform-tools-latest-darwin.zip
          rm -rf /tmp/pt
          mkdir -p /tmp/pt .bundle/adb
          unzip -q /tmp/pt.zip -d /tmp/pt
          cp /tmp/pt/platform-tools/adb .bundle/adb/adb
          chmod +x .bundle/adb/adb

      - name: Build single file
        run: |
          ARGS=(--noconfirm --windowed --onefile --clean --name "TikTok免拔卡助手" --distpath dist)
          ARGS+=(--add-data ".bundle/adb/adb:adb")
          for f in apks/*.apk; do
            ARGS+=(--add-data "$f:apks")
          done
          python -m PyInstaller "${ARGS[@]}" app.py
          codesign --force --sign - "dist/TikTok免拔卡助手" || true
          cp "dist/TikTok免拔卡助手" "dist/${{ matrix.asset }}"
          ls -lh dist
          file "dist/${{ matrix.asset }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.asset }}

      - name: Publish release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ttk-helper-v1.0.2
          name: TikTok 免拔卡助手 macOS v1.0.2
          body: |
            macOS 单文件程序（苹果芯片 / Intel 各一份）。
            第一次打开若被拦截：右键打开，或到「系统设置 → 隐私与安全性」允许。
            chmod +x 后运行。
          files: dist/${{ matrix.asset }}
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
