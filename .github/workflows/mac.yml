name: mac

on:
  push:
    branches: [tiktok-usb-helper, main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Tk and install PyInstaller
        run: |
          uname -m
          python -c "import tkinter; print('tk', tkinter.TkVersion)"
          python -m pip install --upgrade pip pyinstaller

      - name: Download macOS adb
        run: |
          curl -fL --retry 3 -o /tmp/pt.zip https://dl.google.com/android/repository/platform-tools-latest-darwin.zip
          rm -rf /tmp/pt
          mkdir -p /tmp/pt .bundle/adb
          unzip -q /tmp/pt.zip -d /tmp/pt
          cp /tmp/pt/platform-tools/adb .bundle/adb/adb
          chmod +x .bundle/adb/adb

      - name: Build Apple Silicon + Intel
        run: |
          set -e
          COMMON=(--noconfirm --windowed --onefile --clean --distpath dist)
          COMMON+=(--add-data ".bundle/adb/adb:adb")
          for f in apks/*.apk; do
            COMMON+=(--add-data "$f:apks")
          done

          python -m PyInstaller "${COMMON[@]}" --target-arch arm64 --name "TikTok-USB-Helper-macOS-Apple" app.py
          codesign --force --sign - "dist/TikTok-USB-Helper-macOS-Apple.app/Contents/MacOS/TikTok-USB-Helper-macOS-Apple" 2>/dev/null || \
            codesign --force --sign - "dist/TikTok-USB-Helper-macOS-Apple" || true

          python -m PyInstaller "${COMMON[@]}" --target-arch x86_64 --name "TikTok-USB-Helper-macOS-Intel" app.py
          codesign --force --sign - "dist/TikTok-USB-Helper-macOS-Intel.app/Contents/MacOS/TikTok-USB-Helper-macOS-Intel" 2>/dev/null || \
            codesign --force --sign - "dist/TikTok-USB-Helper-macOS-Intel" || true

          # onefile windowed may emit .app; normalize to bare binaries for download buttons
          for arch in Apple Intel; do
            name="TikTok-USB-Helper-macOS-$arch"
            if [[ -d "dist/${name}.app" ]]; then
              cp "dist/${name}.app/Contents/MacOS/${name}" "dist/${name}"
            fi
            chmod +x "dist/${name}" || true
            file "dist/${name}" || true
          done
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: mac-helper-apple
          path: dist/TikTok-USB-Helper-macOS-Apple

      - uses: actions/upload-artifact@v4
        with:
          name: mac-helper-intel
          path: dist/TikTok-USB-Helper-macOS-Intel

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ttk-helper-v1.0.3
          name: TikTok 免拔卡助手 macOS v1.0.3
          body: |
            macOS 单文件：Apple 芯片与 Intel 各一份。
            chmod +x 后运行；若被拦截请右键打开或到隐私与安全性允许。
          files: |
            dist/TikTok-USB-Helper-macOS-Apple
            dist/TikTok-USB-Helper-macOS-Intel
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
